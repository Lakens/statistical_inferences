<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Variation in Correlations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Open+Sans:ital,wght@0,400;0,600;1,400&family=Fira+Code&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.26.0/plotly.min.js"></script>
<style>
:root {
  --bg:    #fffafa;
  --bg2:   #f7f7f7;
  --ink:   #1c1717;
  --ink2:  #3d3535;
  --ink3:  #666060;
  --rule:  #d6dadc;
  --red:   #a60a0a;
  --red-l: #c41010;
  --blue:  #1a6e9a;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: 'Open Sans', sans-serif;
  font-size: 15px; line-height: 1.65;
  padding: 20px 20px 8px; overflow: hidden;
}
.calc-label {
  font-size: 10px; font-weight: 600;
  letter-spacing: .18em; text-transform: uppercase;
  color: var(--ink3); margin-bottom: 5px;
}
.calc-heading {
  font-family: 'Montserrat', sans-serif;
  font-weight: 600; font-size: 1.1rem;
  color: var(--ink); margin-bottom: 16px;
  padding-bottom: 9px; border-bottom: 2px solid var(--red);
}
.input-panel {
  background: var(--bg2);
  border: 1px solid var(--rule);
  border-left: 3px solid var(--red);
  padding: 14px 18px; margin-bottom: 12px;
}
.input-row { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
.input-group { display: flex; flex-direction: column; gap: 5px; }
.input-label {
  font-size: 10px; font-weight: 600;
  letter-spacing: .08em; text-transform: uppercase; color: var(--ink3);
}
.sym {
  font-style: italic; font-size: .88rem;
  text-transform: none; letter-spacing: 0;
  font-weight: 400; color: var(--red);
}
input[type="number"] {
  font-family: 'Fira Code', monospace;
  font-size: 13px; background: var(--bg);
  border: 1px solid var(--rule);
  border-bottom: 2px solid var(--red);
  padding: 6px 8px; color: var(--ink);
  outline: none; width: 90px;
  transition: border-color .2s;
  -moz-appearance: textfield;
}
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
input[type="number"]:focus { border-bottom-color: var(--red-l); }
.btn {
  font-family: 'Open Sans', sans-serif;
  font-size: 11px; font-weight: 600;
  background: var(--red); color: #fff;
  border: none; padding: 8px 14px;
  cursor: pointer; letter-spacing: .06em;
  text-transform: uppercase;
  transition: background .15s;
}
.btn:hover { background: var(--red-l); }
.legend-row {
  display: flex; gap: 20px; align-items: center;
  font-size: 0.85rem; color: var(--ink2);
  padding-bottom: 10px; flex-wrap: wrap;
}
.legend-item { display: flex; align-items: center; gap: 6px; }
.plot-wrap { border: 1px solid var(--rule); background: var(--bg); margin: 0 auto 10px; width: 67%; }
#plotDiv { width: 100%; }
.text-block {
  font-size: .88rem; line-height: 1.6;
  padding: 10px 14px;
  background: var(--bg2);
  border-left: 3px solid var(--rule);
  color: var(--ink2);
}
.text-block strong { color: var(--ink); }
</style>
</head>
<body>

<p class="calc-label">Interactive simulation</p>
<h2 class="calc-heading">Random Variation in Correlations</h2>

<div class="input-panel">
  <div class="input-row">
    <div class="input-group">
      <label class="input-label" for="nIn">Sample size <span class="sym">n</span></label>
      <input type="number" id="nIn" min="5" max="2000" step="1" value="30">
    </div>
    <div class="input-group">
      <label class="input-label" for="rhoIn">True correlation <span class="sym">&#961;</span></label>
      <input type="number" id="rhoIn" min="-0.99" max="0.99" step="0.05" value="0.55">
    </div>
    <div class="input-group">
      <div class="input-label">&nbsp;</div>
      <button class="btn" id="resampleBtn">New sample</button>
    </div>
  </div>
</div>

<div class="legend-row">
  <div class="legend-item">
    <span style="width:26px;height:0;border-top:2px dotted #1c1717;display:inline-block;"></span>
    True population line
  </div>
  <div class="legend-item">
    <span style="width:26px;height:3px;background:#a60a0a;display:inline-block;"></span>
    Observed regression line
  </div>
  <div class="legend-item">
    <span style="width:26px;height:12px;background:rgba(26,110,154,0.25);border:1px solid rgba(26,110,154,0.5);display:inline-block;"></span>
    95% CI
  </div>
</div>

<div class="plot-wrap"><div id="plotDiv"></div></div>
<div id="statsBlock" class="text-block"></div>

<script>
var MU = 100, SIGMA = 15;
var FONT = { family: "'Open Sans', sans-serif", color: '#1c1717', size: 12 };

// Seeded PRNG (Mulberry32) used only for the initial render so it matches
// the book's example (n=30, rho=0.55 → r=0.43).
function mulberry32(seed) {
  var a = seed >>> 0;
  return function() {
    a = (a + 0x6D2B79F5) >>> 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) >>> 0;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

var _rngFn = mulberry32(33);  // replaced with Math.random on first interaction

function randn() {
  var u, v;
  do { u = _rngFn(); } while (u === 0);
  do { v = _rngFn(); } while (v === 0);
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

var _phTimer = null;
function postHeight() {
  clearTimeout(_phTimer);
  _phTimer = setTimeout(function() {
    var h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
    window.parent.postMessage({ iframeHeight: h }, '*');
  }, 150);
}

function getSquareSize() {
  var w = document.getElementById('plotDiv').getBoundingClientRect().width;
  return Math.max(240, Math.round(w || 400));
}

function update() {
  var n   = Math.max(5, parseInt(document.getElementById('nIn').value, 10) || 30);
  var rhoRaw = parseFloat(document.getElementById('rhoIn').value);
  var rho = Math.min(0.99, Math.max(-0.99, isNaN(rhoRaw) ? 0.55 : rhoRaw));

  // Correlated bivariate normal: twin 1 (x) and twin 2 (y)
  var xs = [], ys = [];
  for (var i = 0; i < n; i++) {
    var z1 = randn(), z2 = randn();
    xs.push(z1 * SIGMA + MU);
    ys.push((rho * z1 + Math.sqrt(1 - rho * rho) * z2) * SIGMA + MU);
  }

  // OLS regression: y = a + b*x
  var xbar = 0, ybar = 0;
  for (var i = 0; i < n; i++) { xbar += xs[i]; ybar += ys[i]; }
  xbar /= n; ybar /= n;

  var SSx = 0, SSy = 0, SSxy = 0;
  for (var i = 0; i < n; i++) {
    var dx = xs[i] - xbar, dy = ys[i] - ybar;
    SSx += dx * dx; SSy += dy * dy; SSxy += dx * dy;
  }
  var b = SSxy / SSx;
  var a = ybar - b * xbar;
  var r = SSxy / Math.sqrt(SSx * SSy);

  // Fisher z CI for observed r — this is the CI for the correlation coefficient ρ
  var zr  = 0.5 * Math.log((1 + r) / (1 - r));
  var seZ = 1 / Math.sqrt(Math.max(4, n - 3));
  var rLo = Math.tanh(zr - 1.96 * seZ);
  var rHi = Math.tanh(zr + 1.96 * seZ);
  var rhoCI = rho >= rLo && rho <= rHi;

  // x values for drawing
  var plotX = [];
  for (var xi = 40; xi <= 160.01; xi += 2) plotX.push(xi);

  // Observed regression line through the data
  var lineY = plotX.map(function(xi) { return a + b * xi; });

  // True population regression line: slope = rho (since sigma_x = sigma_y)
  var trueLineY = plotX.map(function(xi) { return MU + rho * (xi - MU); });

  // CI fan: the two boundary lines through (xbar, ybar) with slopes rLo and rHi.
  // The true line (slope = rho) lies inside the fan exactly when rho is in [rLo, rHi].
  // At each x: take min and max of the two boundary values so the fill covers
  // both sides of the crossing point at x = xbar.
  var ciMinY = plotX.map(function(xi) {
    return Math.min(ybar + rLo * (xi - xbar), ybar + rHi * (xi - xbar));
  });
  var ciMaxY = plotX.map(function(xi) {
    return Math.max(ybar + rLo * (xi - xbar), ybar + rHi * (xi - xbar));
  });

  var sz = getSquareSize();

  var AXSHARED = {
    zeroline: false, gridcolor: '#ede8e8', linecolor: '#d6dadc',
    range: [40, 160],
    tickvals: [40, 60, 80, 100, 120, 140, 160]
  };

  Plotly.react('plotDiv', [
    // CI fan lower boundary (invisible base for fill)
    { x: plotX, y: ciMinY, mode: 'lines',
      line: { width: 0 }, showlegend: false, hoverinfo: 'skip' },
    // CI fan upper boundary (filled down to previous trace)
    { x: plotX, y: ciMaxY, mode: 'lines',
      fill: 'tonexty', fillcolor: 'rgba(26,110,154,0.2)',
      line: { width: 0 }, showlegend: false, hoverinfo: 'skip' },
    // True population regression line (black dotted)
    { x: plotX, y: trueLineY, mode: 'lines',
      line: { color: '#1c1717', width: 2, dash: 'dot' },
      showlegend: false, hoverinfo: 'skip' },
    // Observed regression line (yellow/orange)
    { x: plotX, y: lineY, mode: 'lines',
      line: { color: '#a60a0a', width: 2.5 },
      showlegend: false, hoverinfo: 'skip' },
    // Data points
    { x: xs, y: ys, mode: 'markers',
      marker: { color: '#1c1717', size: 5, opacity: 0.75 },
      showlegend: false,
      hovertemplate: 'Twin 1: %{x:.1f}<br>Twin 2: %{y:.1f}<extra></extra>' }
  ], {
    width: sz, height: sz,
    xaxis: Object.assign({ title: { text: 'IQ twin 1', font: { size: 13 } } }, AXSHARED),
    yaxis: Object.assign({ title: { text: 'IQ twin 2', font: { size: 13 } } }, AXSHARED),
    title: {
      text: '<b>r = ' + r.toFixed(2) + '</b>',
      font: { size: 14, color: '#1c1717', family: "'Montserrat', sans-serif" },
      x: 0.5, xanchor: 'center'
    },
    plot_bgcolor:  '#fffafa',
    paper_bgcolor: '#fffafa',
    font: FONT,
    margin: { l: 58, r: 20, t: 40, b: 55 },
    showlegend: false,
    hovermode: 'closest'
  }, { responsive: false, displayModeBar: false });

  // Stats block
  document.getElementById('statsBlock').innerHTML =
    'n = <strong>' + n + '</strong>'
    + '&nbsp;&nbsp;|&nbsp;&nbsp;'
    + 'Observed <em>r</em> = <strong>' + r.toFixed(2) + '</strong>,'
    + ' 95% CI [' + rLo.toFixed(2) + ', ' + rHi.toFixed(2) + ']'
    + '&nbsp;&nbsp;|&nbsp;&nbsp;'
    + 'True &rho; = ' + rho.toFixed(2)
    + ' <span style="font-size:.82rem;color:' + (rhoCI ? 'var(--blue)' : 'var(--red)') + ';">'
    + (rhoCI ? '&#10003;&nbsp;inside CI' : '&#10007;&nbsp;outside CI')
    + '</span>';

  postHeight();
}

function activateRandom() { _rngFn = Math.random.bind(Math); }

document.getElementById('resampleBtn').addEventListener('click', function() {
  activateRandom(); update();
});
['nIn', 'rhoIn'].forEach(function(id) {
  document.getElementById(id).addEventListener('change', function() {
    activateRandom(); update();
  });
});

var _resizeTimer = null;
window.addEventListener('resize', function() {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(function() { update(); postHeight(); }, 80);
});
window.addEventListener('load', function() { setTimeout(function() { update(); postHeight(); }, 100); });
if (typeof ResizeObserver !== 'undefined') {
  new ResizeObserver(function() {
    clearTimeout(_resizeTimer);
    _resizeTimer = setTimeout(function() { update(); postHeight(); }, 80);
  }).observe(document.getElementById('plotDiv'));
}

update();
</script>
</body>
</html>
