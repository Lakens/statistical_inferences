name: Book Checks

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  render-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R package dependencies
        run: |
          Rscript --vanilla -e "pkgs <- readLines('requirements-r.txt', warn=FALSE); pkgs <- trimws(pkgs); pkgs <- pkgs[nzchar(pkgs) & !grepl('^#', pkgs)]; missing <- setdiff(pkgs, rownames(installed.packages())); if (length(missing) > 0) { message('Installing: ', paste(missing, collapse=', ')); install.packages(missing, repos='https://cloud.r-project.org', dependencies=TRUE) } else { message('All required R packages already installed.') }; missing_after <- setdiff(pkgs, rownames(installed.packages())); if (length(missing_after) > 0) stop('Still missing packages: ', paste(missing_after, collapse=', '))"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render book (HTML)
        run: quarto render --to html

      - name: Run book integrity tests
        run: Rscript scripts/check_book_tests.R
