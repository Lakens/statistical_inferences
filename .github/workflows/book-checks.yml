name: Book Checks

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  render-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::binom
            any::BUCSS
            any::cocor
            any::effectsize
            any::gert
            any::ggplot2
            any::gridExtra
            any::JustifyAlpha
            any::kableExtra
            any::knitr
            any::MBESS
            any::metafor
            any::MOTE
            any::patchwork
            any::puniform
            any::pwr
            any::pwrss
            any::reshape2
            any::rmarkdown
            any::rpact
            any::Superpower
            any::tidyr
            any::TOSTER
            any::truncnorm
            any::webexercises
            any::zcurve

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render book (HTML)
        run: quarto render --to html

      - name: Run book integrity tests
        run: Rscript scripts/check_book_tests.R
