name: Book Checks

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  render-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            binom
            BUCSS
            cocor
            effectsize
            gert
            ggplot2
            gridExtra
            JustifyAlpha
            kableExtra
            knitr
            MBESS
            metafor
            MOTE
            patchwork
            puniform
            pwr
            pwrss
            reshape2
            rmarkdown
            rpact
            Superpower
            tidyr
            TOSTER
            truncnorm
            webexercises
            zcurve

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render book (HTML)
        run: quarto render --to html

      - name: Run book integrity tests
        run: Rscript scripts/check_book_tests.R
