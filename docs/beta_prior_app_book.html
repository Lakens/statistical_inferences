<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beta Prior Distributions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Open+Sans:ital,wght@0,400;0,600;1,400&family=Fira+Code&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jstat/1.9.6/jstat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.26.0/plotly.min.js"></script>
<style>
:root {
  --bg:    #fffafa;
  --bg2:   #f7f7f7;
  --ink:   #1c1717;
  --ink2:  #3d3535;
  --ink3:  #666060;
  --rule:  #d6dadc;
  --red:   #a60a0a;
  --red-l: #c41010;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: 'Open Sans', sans-serif;
  font-size: 15px; line-height: 1.65;
  padding: 20px 20px 32px; overflow: hidden;
}
.calc-label {
  font-size: 10px; font-weight: 600;
  letter-spacing: .18em; text-transform: uppercase;
  color: var(--ink3); margin-bottom: 5px;
}
.calc-heading {
  font-family: 'Montserrat', sans-serif;
  font-weight: 600; font-size: 1.1rem;
  color: var(--ink); margin-bottom: 16px;
  padding-bottom: 9px; border-bottom: 2px solid var(--red);
}
.plots-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.plot-cell {
  border: 1px solid var(--rule);
  background: var(--bg);
  display: flex; flex-direction: column;
}
.plot-cell > div:first-child { width: 100%; height: 220px; }
.cell-footer {
  background: var(--bg2);
  border-top: 1px solid var(--rule);
  padding: 8px 10px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}
.param-group {
  display: flex; align-items: center; gap: 5px;
}
.param-label {
  font-size: 11px; font-weight: 600;
  letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink3); white-space: nowrap;
}
.param-sym {
  font-style: italic; font-size: .95rem;
  color: var(--red); font-weight: 400;
  text-transform: none;
}
input[type="number"] {
  font-family: 'Fira Code', monospace;
  font-size: 12px; background: var(--bg);
  border: 1px solid var(--rule);
  border-bottom: 2px solid var(--red);
  padding: 4px 6px; color: var(--ink);
  outline: none; width: 68px;
  transition: border-color .2s;
  -moz-appearance: textfield;
}
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
input[type="number"]:focus { border-bottom-color: var(--red-l); }
.cell-stats {
  margin-left: auto;
  font-family: 'Fira Code', monospace;
  font-size: 11px; color: var(--ink3);
  white-space: nowrap;
}
@media (max-width: 520px) {
  .plots-grid { grid-template-columns: 1fr; }
  .cell-stats { margin-left: 0; }
}
</style>
</head>
<body>

<p class="calc-label">Interactive visualization</p>
<h2 class="calc-heading">Beta Prior Distributions</h2>

<div class="plots-grid">
  <div class="plot-cell">
    <div id="plot0"></div>
    <div class="cell-footer">
      <div class="param-group">
        <span class="param-label"><span class="param-sym">&alpha;</span></span>
        <input type="number" id="a0" min="0.01" step="0.5" value="1">
      </div>
      <div class="param-group">
        <span class="param-label"><span class="param-sym">&beta;</span></span>
        <input type="number" id="b0" min="0.01" step="0.5" value="1">
      </div>
      <span class="cell-stats" id="stats0"></span>
    </div>
  </div>
  <div class="plot-cell">
    <div id="plot1"></div>
    <div class="cell-footer">
      <div class="param-group">
        <span class="param-label"><span class="param-sym">&alpha;</span></span>
        <input type="number" id="a1" min="0.01" step="0.5" value="1">
      </div>
      <div class="param-group">
        <span class="param-label"><span class="param-sym">&beta;</span></span>
        <input type="number" id="b1" min="0.01" step="0.5" value="0.5">
      </div>
      <span class="cell-stats" id="stats1"></span>
    </div>
  </div>
  <div class="plot-cell">
    <div id="plot2"></div>
    <div class="cell-footer">
      <div class="param-group">
        <span class="param-label"><span class="param-sym">&alpha;</span></span>
        <input type="number" id="a2" min="0.01" step="0.5" value="4">
      </div>
      <div class="param-group">
        <span class="param-label"><span class="param-sym">&beta;</span></span>
        <input type="number" id="b2" min="0.01" step="0.5" value="4">
      </div>
      <span class="cell-stats" id="stats2"></span>
    </div>
  </div>
  <div class="plot-cell">
    <div id="plot3"></div>
    <div class="cell-footer">
      <div class="param-group">
        <span class="param-label"><span class="param-sym">&alpha;</span></span>
        <input type="number" id="a3" min="0.01" step="0.5" value="100">
      </div>
      <div class="param-group">
        <span class="param-label"><span class="param-sym">&beta;</span></span>
        <input type="number" id="b3" min="0.01" step="0.5" value="100">
      </div>
      <span class="cell-stats" id="stats3"></span>
    </div>
  </div>
</div>

<script>
var XS = [];
for (var i = 1; i <= 999; i++) XS.push(i / 1000);

// Inner range for y-axis scaling (avoids poles at 0 and 1)
var XS_INNER = XS.filter(function(x) { return x >= 0.01 && x <= 0.99; });

var AXIS = { zeroline: false, gridcolor: '#ede8e8', linecolor: '#d6dadc' };
var FONT = { family: "'Open Sans', sans-serif", color: '#1c1717', size: 11 };

function betaModeStr(a, b) {
  if (a > 1 && b > 1) return ((a - 1) / (a + b - 2)).toFixed(3);
  if (a <= 1 && b <= 1) return 'U-shaped';
  if (a <= 1)           return '0';
  return '1';
}

function drawPanel(i) {
  var a = Math.max(0.01, parseFloat(document.getElementById('a' + i).value) || 1);
  var b = Math.max(0.01, parseFloat(document.getElementById('b' + i).value) || 1);

  var ys = XS.map(function(x) { return jStat.beta.pdf(x, a, b); });

  // y-axis max from interior range to avoid domination by poles
  var innerMax = 0;
  for (var k = 0; k < XS.length; k++) {
    if (XS[k] >= 0.01 && XS[k] <= 0.99) innerMax = Math.max(innerMax, ys[k]);
  }
  var yMax = Math.max(innerMax * 1.15, 0.5);

  var title = 'α = ' + a + ', β = ' + b;

  Plotly.react('plot' + i, [{
    x: XS, y: ys,
    type: 'scatter', mode: 'lines',
    line: { color: '#a60a0a', width: 2.5 },
    hovertemplate: 'p = %{x:.3f}<br>density = %{y:.3f}<extra></extra>'
  }], {
    title: { text: title, font: { family: "'Montserrat', sans-serif", size: 12 }, x: 0.5 },
    xaxis: Object.assign({ title: { text: 'p', font: { size: 11 } }, range: [0, 1] }, AXIS),
    yaxis: Object.assign({ title: { text: 'Density', font: { size: 11 } }, range: [0, yMax] }, AXIS),
    plot_bgcolor:  '#fffafa',
    paper_bgcolor: '#fffafa',
    font: FONT,
    margin: { l: 46, r: 10, t: 36, b: 40 },
    showlegend: false
  }, { responsive: true, displayModeBar: false });

  // Stats: mean and mode
  var mean = a / (a + b);
  document.getElementById('stats' + i).textContent =
    'mean = ' + mean.toFixed(3) + '  mode = ' + betaModeStr(a, b);
}

function drawAll() {
  for (var i = 0; i < 4; i++) drawPanel(i);
  postHeight();
}

// Event listeners — update only the changed panel
for (var idx = 0; idx < 4; idx++) {
  (function(i) {
    document.getElementById('a' + i).addEventListener('input', function() { drawPanel(i); postHeight(); });
    document.getElementById('b' + i).addEventListener('input', function() { drawPanel(i); postHeight(); });
    document.getElementById('a' + i).addEventListener('change', function() { drawPanel(i); postHeight(); });
    document.getElementById('b' + i).addEventListener('change', function() { drawPanel(i); postHeight(); });
  })(idx);
}

// Debounced postHeight
var _phTimer = null;
function postHeight() {
  clearTimeout(_phTimer);
  _phTimer = setTimeout(function() {
    var h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
    window.parent.postMessage({ iframeHeight: h }, '*');
  }, 150);
}

window.addEventListener('resize', function() { drawAll(); });
window.addEventListener('load', function() { setTimeout(postHeight, 400); });
if (typeof ResizeObserver !== 'undefined') {
  new ResizeObserver(postHeight).observe(document.body);
}

drawAll();
</script>
</body>
</html>
