project:
  type: book
  output-dir: docs
  resources:
    - resources
    - likelihood_ratio_app_book.html
    - cohens_d_app_book.html
    - sequential_testing_app_book.html
    - guess_correlation_app_book.html
    - confidence_interval_app_book.html
    - ppv_app_book.html
    - within_between_app_book.html
    - pvalue_distribution_app_book.html
    - means_difference_app_book.html
    - optional_stopping_app_book.html
    - bayesian_updating_app_book.html
    - beta_prior_app_book.html
    - bayes_factor_app_book.html
  post-render:
    - '"C:/Program Files/R/R-4.5.3/bin/x64/Rscript.exe" scripts/check_book_tests.R'
execute:
  freeze: auto

book:
  title: "Improving Your Statistical Inferences"
  subtitle: ""
  author: "Daniël Lakens"
  description: "This open educational resource contains information to improve statistical inferences, design better experiments, and report scientific research more transparently."
  cover-image: images/logos/improving.svg
  image: images/logos/improving.svg
  favicon: images/logos/favicon.ico
  cookie-consent: false
  google-analytics: "G-0MK2WTGRM3"
  page-navigation: true
  search: true
  # comments:
  #   hypothesis:
  #     theme: clean
  #     openSidebar: false
  repo-url: https://github.com/Lakens/statistical_inferences
  repo-branch: master
  repo-actions: []
  downloads: [pdf, epub]
  navbar:
    right:
      - icon: bug
        href: https://github.com/Lakens/statistical_inferences/issues/new
        aria-label: "Report Issue"
  sidebar:
    collapse-level: 2
  # sharing: [twitter]
  # sidebar:
  #   style: docked
  #   background: light
  margin-header: ""
  page-footer:
    left: "Lakens, D. (2022). Improving Your Statistical Inferences. Retrieved from https://lakens.github.io/statistical_inferences/. https://doi.org/10.5281/zenodo.6409077"
  chapters:
  - index.qmd
  - 01-pvalue.qmd
  - 02-errorcontrol.qmd
  - 03-likelihoods.qmd
  - 04-bayes.qmd
  - 05-questions.qmd
  - 06-effectsize.qmd
  - 07-CI.qmd
  - 08-samplesizejustification.qmd
  - 09-equivalencetest.qmd
  - 10-sequential.qmd
  - 11-meta.qmd
  - 12-bias.qmd
  - 13-prereg.qmd
  - 14-computationalreproducibility.qmd
  - 15-researchintegrity.qmd
  - 16-confirmationbias.qmd
  - 17-replication.qmd
  - references.qmd
  - changelog.qmd


bibliography: include/book.bib
csl: include/apa.csl
format:
  pdf:
    toc: true
    number-sections: true
    colorlinks: true
    df-print: kable
    html-table-processing: none
  epub:
    toc: true
    df-print: kable
    html-table-processing: none
  html:
    theme:
      light:
      - flatly
      - include/light.scss
      dark:
      - darkly
      - include/dark.scss
    css: [include/booktem.css, include/style.css, include/webex.css]
    df-print: kable
    html-table-processing: none
    toc: true
    code-link: true
    code-fold: false
    code-line-numbers: false
    code-overflow: scroll
    code-copy: true
    highlight-style: a11y
    monofont: Fira Code
    mainfont: Open Sans
    include-after-body: [include/webex.js, include/script.js]
